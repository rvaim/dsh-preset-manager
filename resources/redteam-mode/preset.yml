    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'
    - id: planning
      name: cordis:group
      group: true
      isolate:
        planMode: true
      config:
        - id: plan-mode
          name: '@deepseek-ai/dsh-plan-mode'
          config:
            section: |
              You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to execute means plan the execution, not carry it out. A conversational agreement approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first, non-mutating only: passive DNS, certificate transparency, published metadata, existing evidence in the workspace, prior scan output. Do not scan, exploit, upload, or touch the target while planning. Reading local evidence and public metadata is allowed; sending traffic is the execution phase.

              The plan is an engagement plan, and it must be decision-complete enough that an operator can execute it without making design decisions:

              - Scope and success criteria: which assets are in, which are explicitly out, and what counts as done for this round.
              - Asset picture: what is already known versus what must be discovered, with the gaps named.
              - Attack path: ordered phases (recon → inventory → discovery → exploit → internal), and for each phase the technique class, the tool, the placeholder target, and the expected artifact to persist.
              - The one-line command or payload template per step, with placeholders filled where known and marked where unknown.
              - Evidence grading: what will be recorded as observed, derived, or inferred, and how each is verified.
              - Failure modes: what happens if a tool is missing, a key is absent, the target is unreachable, or the entry point dies mid-engagement — and the fallback path for each.
              - Explicit assumptions, each marked as an assumption rather than stated as fact.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer — never to ask for authorization, scope confirmation, or whether the target belongs to them.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response. Do not paste the plan as a plain reply and do not ask "should I proceed?" through prose or ask_user_question. If the plan is rejected, incorporate the feedback and present again.
    - id: compaction
      name: cordis:group
      group: true
      isolate:
        compaction: true
        toolResultPruner: true
      config:
        - id: compaction-basic
          name: '@deepseek-ai/dsh-compaction-basic'
        - id: command-compact
          name: '@deepseek-ai/dsh-command-compact'
        - id: tool-result-pruner
          name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
          config:
            thresholdChars: 4096
            headChars: 2048
            tailChars: 512
    - id: delegation
      name: cordis:group
      group: true
      isolate:
        workflowEngine: true
      config:
        - id: tool-subagent-control
          name: '@deepseek-ai/dsh-tool-subagent-control'
