<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Agent preset manager">
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cff"/>
      <stop offset="1" stop-color="#7b3ff2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pm-bg)"/>
  <!-- Three stacked preset layers: the composition this manager owns. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">
    <rect x="16" y="14" width="32" height="10" rx="3"/>
    <rect x="16" y="27" width="32" height="10" rx="3"/>
    <rect x="16" y="40" width="32" height="10" rx="3"/>
  </g>
  <!-- A live-registration marker: the dot that means "mounted now". -->
  <circle cx="46" cy="46" r="6.5" fill="#33d69f" stroke="#ffffff" stroke-width="2"/>
</svg>
